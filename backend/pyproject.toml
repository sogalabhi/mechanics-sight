[project]
name = "beam-solver"
version = "0.1.0"
description = "Exact shear force and bending moment diagrams for beams."
requires-python = ">=3.12"
dependencies = ["numpy>=2", "pydantic>=2"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2",
    "sympy>=1.12",
    "pre-commit>=3",
]

[project.scripts]
beam-solver = "beam_solver.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beam_solver"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF", "PT"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["beam_solver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["beam_solver"]

[tool.importlinter]
root_package = "beam_solver"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "beam_solver.api | beam_solver.cli",
    "beam_solver.io | beam_solver.plotting",
    "beam_solver.analysis",
    "beam_solver.solvers",
    "beam_solver.domain",
]
