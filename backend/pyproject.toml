[project]
name = "beam-solver"
version = "0.1.0"
description = "Exact shear force and bending moment diagrams for beams."
requires-python = ">=3.12"
dependencies = ["numpy>=2", "pydantic>=2"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2",
    "sympy>=1.12",
    "pre-commit>=3",
]

[project.scripts]
beam-solver = "beam_solver.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beam_solver"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF", "PT"]
# Physics notation in comments, docstrings and worked-step text is deliberate.
allowed-confusables = ["–", "−", "σ"]

[tool.ruff.lint.per-file-ignores]
# Worked steps are LaTeX in long string literals: wrapping them would change the text.
"src/beam_solver/analysis/canonical.py" = ["E501"]
"src/beam_solver/analysis/steps.py" = ["E501"]
"src/beam_solver/analysis/methods/*.py" = ["E501"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["beam_solver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["beam_solver"]

[tool.importlinter]
root_package = "beam_solver"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "beam_solver.api | beam_solver.cli",
    "beam_solver.io | beam_solver.plotting",
    "beam_solver.analysis",
    "beam_solver.solvers",
    "beam_solver.domain",
]

[[tool.importlinter.contracts]]
name = "The material lab does not depend on the beam analysis layers"
type = "forbidden"
source_modules = ["beam_solver.material"]
forbidden_modules = [
    "beam_solver.analysis",
    "beam_solver.solvers",
    "beam_solver.domain",
    "beam_solver.io",
    "beam_solver.api",
    "beam_solver.plotting",
    "beam_solver.cli",
]
