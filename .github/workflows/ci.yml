name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest --cov

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd backend && uv sync --all-extras && uv run python scripts/export_openapi.py
      - run: cd frontend && npx -y openapi-typescript@7 ../shared/openapi.json -o src/api/schema.d.ts
      - name: Fail if the committed contract is stale
        run: git diff --exit-code shared/openapi.json frontend/src/api/schema.d.ts
