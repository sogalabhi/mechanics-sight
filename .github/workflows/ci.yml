name: CI
on:
  push:
  pull_request:

# a newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest --cov

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd backend && uv sync --all-extras && uv run python scripts/export_openapi.py
      - run: cd frontend && npx -y openapi-typescript@7 ../shared/openapi.json -o src/api/schema.d.ts
      - name: Fail if the committed contract is stale
        run: git diff --exit-code shared/openapi.json frontend/src/api/schema.d.ts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      # reads shared/fixtures, so this also checks the frontend against the contract cases
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d --wait
      - name: Smoke test through nginx (same path the browser uses)
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS -X POST http://localhost:8080/api/v1/analyze \
            -H 'Content-Type: application/json' \
            -d '{"schema_version":1,"length":6,"supports":[{"id":"a","type":"pin","position":0},{"id":"b","type":"roller","position":6}],"loads":[{"id":"p","type":"point","position":3,"magnitude":-10}]}' \
            | grep -q '"fy":5.0'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down
        if: always()

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --all-extras
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: frontend/test-results/
